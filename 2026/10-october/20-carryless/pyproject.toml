[project]
name = "carryless"
version = "1.0.0"
description = "Builds a round-robin fixture where no team keeps meeting opponents straight after the same team, with as few home/away breaks as it can find"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
carryless = "carryless.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "SIM", "RUF", "N", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]
