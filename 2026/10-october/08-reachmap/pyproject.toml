[project]
name = "reachmap"
version = "1.0.0"
description = "A linter for screen layouts: slow, small and out-of-reach targets, using Fitts's law"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
reachmap = "reachmap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "SIM", "RUF", "N", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "src"
